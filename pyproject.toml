[project]
name = "entropydata-connector-snowflake-usage"
version = "0.1.0"
description = "Snowflake usage tracking connector for Entropy Data"
requires-python = ">=3.13"
dependencies = [
    "snowflake-connector-python>=4.7.2",
    "requests>=2.33.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.12.0",
]

[project.scripts]
entropydata-connector-snowflake-usage = "entropydata_connector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entropydata_connector"]

[tool.uv]
package = true
